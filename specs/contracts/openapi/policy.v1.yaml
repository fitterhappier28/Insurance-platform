openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: CLP Policy API
  version: 1.0.0
  description: |
    Accounts, quotes, bind and policy reads for Commercial Property.
    Requirements: FR-1, FR-2, FR-6, FR-7, FR-11, FR-12, FR-13, FR-14, FR-16, FR-17.
servers:
  - url: http://localhost:5101
tags:
  - name: Accounts
  - name: Quotes
  - name: Policies
  - name: Reconciliation
paths:
  /v1/accounts:
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Create an Account with its Applicant
      parameters:
        - $ref: 'common.v1.yaml#/components/parameters/TenantId'
        - $ref: 'common.v1.yaml#/components/parameters/IdempotencyKey'
        - $ref: 'common.v1.yaml#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccountRequest' }
      responses:
        '201':
          description: Created
          headers:
            Location: { schema: { type: string } }
            Idempotent-Replayed: { $ref: 'common.v1.yaml#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: 'common.v1.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'common.v1.yaml#/components/responses/Forbidden' }
        '409': { $ref: 'common.v1.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.v1.yaml#/components/responses/Unprocessable' }
  /v1/accounts/{accountId}:
    get:
      tags: [Accounts]
      operationId: getAccount
      parameters:
        - $ref: 'common.v1.yaml#/components/parameters/TenantId'
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '404': { $ref: 'common.v1.yaml#/components/responses/NotFound' }
  /v1/quotes:
    post:
      tags: [Quotes]
      operationId: createQuote
      summary: Create a Policy with Revision 1 from a schedule, decide and price it
      description: |
        Calls Rules, then Rating unless the Decision is Decline. Returns 201 for every Decision;
        the outcome is in `status` and `decision`.
      parameters:
        - $ref: 'common.v1.yaml#/components/parameters/TenantId'
        - $ref: 'common.v1.yaml#/components/parameters/IdempotencyKey'
        - $ref: 'common.v1.yaml#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateQuoteRequest' }
      responses:
        '201':
          description: Quote created
          headers:
            Location: { schema: { type: string } }
            Idempotent-Replayed: { $ref: 'common.v1.yaml#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '400': { $ref: 'common.v1.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'common.v1.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.v1.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common.v1.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common.v1.yaml#/components/responses/Unprocessable' }
        '503': { $ref: 'common.v1.yaml#/components/responses/ServiceUnavailable' }
  /v1/quotes/{quoteId}:
    get:
      tags: [Quotes]
      operationId: getQuote
      parameters:
        - $ref: 'common.v1.yaml#/components/parameters/TenantId'
        - { name: quoteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '404': { $ref: 'common.v1.yaml#/components/responses/NotFound' }
  /v1/quotes/{quoteId}/bind:
    post:
      tags: [Quotes]
      operationId: bindQuote
      summary: Bind a Straight-Through Quote
      description: |
        Re-runs Rules and Rating; refuses if anything changed (quote-stale). Commits the bound
        revision and the policy-bound event together. Booking happens asynchronously.
      parameters:
        - $ref: 'common.v1.yaml#/components/parameters/TenantId'
        - $ref: 'common.v1.yaml#/components/parameters/IdempotencyKey'
        - $ref: 'common.v1.yaml#/components/parameters/CorrelationId'
        - { name: quoteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: Bound
          headers:
            Idempotent-Replayed: { $ref: 'common.v1.yaml#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BindResult' }
        '400': { $ref: 'common.v1.yaml#/components/responses/BadRequest' }
        '403': { $ref: 'common.v1.yaml#/components/responses/Forbidden' }
        '404': { $ref: 'common.v1.yaml#/components/responses/NotFound' }
        '409':
          description: quote-not-bindable, quote-expired, quote-stale or idempotency-key-in-flight
          content:
            application/problem+json:
              schema: { $ref: 'common.v1.yaml#/components/schemas/Problem' }
        '422': { $ref: 'common.v1.yaml#/components/responses/Unprocessable' }
        '503': { $ref: 'common.v1.yaml#/components/responses/ServiceUnavailable' }
  /v1/policies/{policyId}:
    get:
      tags: [Policies]
      operationId: getPolicy
      summary: Latest bound revision with Booking Status
      parameters:
        - $ref: 'common.v1.yaml#/components/parameters/TenantId'
        - { name: policyId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policy' }
        '404': { $ref: 'common.v1.yaml#/components/responses/NotFound' }
  /v1/reconciliation/unbooked:
    get:
      tags: [Reconciliation]
      operationId: listUnbooked
      summary: Bound revisions still Pending booking after a given age (FR-12)
      parameters:
        - $ref: 'common.v1.yaml#/components/parameters/TenantId'
        - { name: olderThanMinutes, in: query, required: false, schema: { type: integer, minimum: 0, default: 5 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [policyId, policyNumber, revisionNo, boundAt]
                      properties:
                        policyId: { type: string, format: uuid }
                        policyNumber: { type: string }
                        revisionNo: { type: integer }
                        boundAt: { type: string, format: date-time }
components:
  schemas:
    Address:
      type: object
      additionalProperties: false
      required: [street, city, state, postalCode]
      properties:
        street: { type: string, maxLength: 200 }
        city: { type: string, maxLength: 100 }
        state: { type: string, pattern: '^[A-Z]{2}$' }
        postalCode: { type: string, pattern: '^\d{5}(-\d{4})?$' }
    CreateAccountRequest:
      type: object
      additionalProperties: false
      required: [name, applicant]
      properties:
        name: { type: string, maxLength: 200 }
        applicant:
          type: object
          additionalProperties: false
          required: [legalName, fein, mailingAddress]
          properties:
            legalName: { type: string, maxLength: 200 }
            fein: { type: string, pattern: '^\d{2}-\d{7}$' }
            mailingAddress: { $ref: '#/components/schemas/Address' }
    Account:
      type: object
      required: [accountId, name, applicant, createdAt]
      properties:
        accountId: { type: string, format: uuid }
        name: { type: string }
        applicant:
          type: object
          required: [applicantId, legalName, fein, mailingAddress]
          properties:
            applicantId: { type: string, format: uuid }
            legalName: { type: string }
            fein: { type: string }
            mailingAddress: { $ref: '#/components/schemas/Address' }
        createdAt: { type: string, format: date-time }
    CreateQuoteRequest:
      type: object
      additionalProperties: false
      description: |
        `ref` values are client-chosen identifiers, unique within the request, used to link
        Exposures to Buildings or Units. The response maps each ref to its server id.
      required: [accountId, effectiveFrom, effectiveTo, coverages, locations, exposures]
      properties:
        accountId: { type: string, format: uuid }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date }
        coverages:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [code, deductible]
            properties:
              code: { type: string, const: BLDG }
              deductible: { type: string, enum: ['1000', '2500', '5000', '10000', '25000'] }
        locations:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/LocationInput' }
        exposures:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ExposureInput' }
    LocationInput:
      type: object
      additionalProperties: false
      required: [ref, address, protectionClass, buildings]
      properties:
        ref: { type: string, maxLength: 64 }
        address: { $ref: '#/components/schemas/Address' }
        protectionClass: { type: integer, minimum: 1, maximum: 10 }
        buildings:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/BuildingInput' }
    BuildingInput:
      type: object
      additionalProperties: false
      required: [ref, construction, yearBuilt, squareFeet]
      properties:
        ref: { type: string, maxLength: 64 }
        construction: { $ref: 'common.v1.yaml#/components/schemas/Construction' }
        yearBuilt: { type: integer, minimum: 1800, maximum: 2100 }
        squareFeet: { type: integer, minimum: 1 }
        units:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [ref, unitNumber, squareFeet]
            properties:
              ref: { type: string, maxLength: 64 }
              unitNumber: { type: string, maxLength: 20 }
              squareFeet: { type: integer, minimum: 1 }
              description: { type: string, maxLength: 200 }
    ExposureInput:
      type: object
      additionalProperties: false
      required: [ref, coverageCode, subjectRef, limit, naicsCode, extension]
      properties:
        ref: { type: string, maxLength: 64 }
        coverageCode: { type: string, const: BLDG }
        subjectRef: { type: string, description: ref of a Building or Unit in this request }
        limit: { $ref: 'common.v1.yaml#/components/schemas/Money' }
        naicsCode: { $ref: 'common.v1.yaml#/components/schemas/NaicsCode' }
        extension: { $ref: 'common.v1.yaml#/components/schemas/NaicsExtension' }
    Quote:
      type: object
      required: [quoteId, policyId, accountId, revisionNo, status, effectiveFrom, effectiveTo, quotedAt, expiresAt, decision, schedule]
      properties:
        quoteId: { type: string, format: uuid, description: Id of the Policy Revision }
        policyId: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        revisionNo: { type: integer }
        status: { type: string, description: 'Quoted, Referred, Declined, Bound. New values may be added.' }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date }
        quotedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        decision:
          type: object
          required: [outcome, rulesetVersion, reasons]
          properties:
            outcome: { type: string, description: 'StraightThrough, Refer, Decline. New values may be added.' }
            rulesetVersion: { type: string }
            reasons:
              type: array
              items: { $ref: 'common.v1.yaml#/components/schemas/DecisionReason' }
        rating:
          oneOf:
            - type: 'null'
            - type: object
              required: [rateManualVersion, writtenPremium, currency, exposures]
              properties:
                rateManualVersion: { type: string }
                writtenPremium: { $ref: 'common.v1.yaml#/components/schemas/Money' }
                currency: { const: USD }
                exposures:
                  type: array
                  items:
                    type: object
                    required: [exposureId, ref, baseRate, premium, factors]
                    properties:
                      exposureId: { type: string, format: uuid }
                      ref: { type: string }
                      baseRate: { $ref: 'common.v1.yaml#/components/schemas/Rate' }
                      premium: { $ref: 'common.v1.yaml#/components/schemas/Money' }
                      factors:
                        type: array
                        items: { $ref: 'common.v1.yaml#/components/schemas/RatedFactor' }
        schedule:
          type: object
          description: The stored schedule, every element with its ref and server-assigned id.
          required: [coverages, locations, exposures]
          properties:
            coverages: { type: array, items: { type: object } }
            locations: { type: array, items: { type: object } }
            exposures: { type: array, items: { type: object } }
    BindResult:
      type: object
      required: [policyId, policyNumber, revisionNo, status, boundAt, writtenPremium, bookingStatus]
      properties:
        policyId: { type: string, format: uuid }
        policyNumber: { type: string, pattern: '^CP-\d{4}-\d{6}$' }
        revisionNo: { type: integer }
        status: { const: Bound }
        boundAt: { type: string, format: date-time }
        writtenPremium: { $ref: 'common.v1.yaml#/components/schemas/Money' }
        bookingStatus: { type: string, description: 'Pending or Booked. New values may be added.' }
    Policy:
      type: object
      required: [policyId, policyNumber, accountId, revisionNo, status, effectiveFrom, effectiveTo, writtenPremium, bookingStatus]
      properties:
        policyId: { type: string, format: uuid }
        policyNumber: { type: string }
        accountId: { type: string, format: uuid }
        revisionNo: { type: integer }
        status: { type: string }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date }
        writtenPremium: { $ref: 'common.v1.yaml#/components/schemas/Money' }
        boundAt: { type: string, format: date-time }
        bookingStatus: { type: string, description: 'Pending or Booked. New values may be added.' }
        transactionId: { type: [string, 'null'], format: uuid }
        bookedAt: { type: [string, 'null'], format: date-time }
