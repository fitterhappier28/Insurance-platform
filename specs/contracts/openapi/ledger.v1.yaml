openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: CLP Ledger API
  version: 1.0.0
  description: Read-only access to immutable premium transactions. Ledger writes only by consuming policy-bound.
servers:
  - url: http://localhost:5104
paths:
  /v1/policies/{policyId}/transactions:
    get:
      operationId: listPolicyTransactions
      parameters:
        - $ref: 'common.v1.yaml#/components/parameters/TenantId'
        - { name: policyId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Transactions for the policy
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TransactionSummary' }
  /v1/transactions/{transactionId}:
    get:
      operationId: getTransaction
      parameters:
        - $ref: 'common.v1.yaml#/components/parameters/TenantId'
        - { name: transactionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Immutable transaction with premium and factor lines
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '404': { $ref: 'common.v1.yaml#/components/responses/NotFound' }
  /v1/reconciliation/self-check:
    get:
      operationId: selfCheck
      summary: Finds mismatches between transaction, premium, and factor lines
      parameters:
        - $ref: 'common.v1.yaml#/components/parameters/TenantId'
      responses:
        '200':
          description: Empty items means all checked transactions reconcile
          content:
            application/json:
              schema:
                type: object
                required: [checked, items]
                properties:
                  checked: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      required: [transactionId, premiumLineId, problem]
                      properties:
                        transactionId: { type: string, format: uuid }
                        premiumLineId: { type: string, format: uuid }
                        problem: { type: string, enum: [transaction-total-mismatch, factor-mismatch] }
components:
  schemas:
    TransactionSummary:
      type: object
      required: [transactionId, transactionType, policyId, policyNumber, revisionNo, effectiveDate, writtenPremium, currency, bookedAt]
      properties:
        transactionId: { type: string, format: uuid }
        transactionType: { type: string, const: NewBusiness }
        policyId: { type: string, format: uuid }
        policyNumber: { type: string }
        revisionNo: { type: integer }
        effectiveDate: { type: string, format: date }
        writtenPremium: { $ref: 'common.v1.yaml#/components/schemas/Money' }
        currency: { const: USD }
        bookedAt: { type: string, format: date-time }
    Transaction:
      allOf:
        - $ref: '#/components/schemas/TransactionSummary'
        - type: object
          required: [rateManualVersion, rulesetVersion, sourceEventId, premiumLines]
          properties:
            rateManualVersion: { type: string }
            rulesetVersion: { type: string }
            sourceEventId: { type: string, format: uuid }
            premiumLines:
              type: array
              items:
                type: object
                required: [premiumLineId, exposureId, coverageCode, locationId, buildingId, unitId, naicsCode, limit, premium, factorLines]
                properties:
                  premiumLineId: { type: string, format: uuid }
                  exposureId: { type: string, format: uuid }
                  coverageCode: { type: string }
                  locationId: { type: string, format: uuid }
                  buildingId: { type: string, format: uuid }
                  unitId: { type: [string, 'null'], format: uuid }
                  naicsCode: { type: string }
                  limit: { $ref: 'common.v1.yaml#/components/schemas/Money' }
                  premium: { $ref: 'common.v1.yaml#/components/schemas/Money' }
                  factorLines:
                    type: array
                    items: { $ref: 'common.v1.yaml#/components/schemas/RatedFactor' }
