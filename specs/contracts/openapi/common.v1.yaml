openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: CLP common components
  version: 1.0.0
  description: Shared parameters, headers, responses and schemas referenced by every CLP service contract.
paths: {}
components:
  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,31}$' }
      example: harbor
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema: { type: string, format: uuid }
  headers:
    CorrelationId:
      schema: { type: string, format: uuid }
    IdempotentReplayed:
      description: Present and true when the response is a stored replay of an earlier request with the same key.
      schema: { type: boolean }
  responses:
    BadRequest:
      description: Missing tenant or idempotency key.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Unknown tenant.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource does not exist for this tenant.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: State conflict; see code.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: Validation failed or idempotency key reused with a different body.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: A required dependency is unavailable. Safe to retry with the same idempotency key.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, traceId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          description: Stable machine-readable code. Clients branch on this. New codes may be added.
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [pointer, code]
            properties:
              pointer: { type: string, description: JSON pointer into the request body }
              code: { type: string }
              detail: { type: string }
    Money:
      type: string
      pattern: '^-?\d+(\.\d{1,4})?$'
      examples: ['1410.75']
    Rate:
      type: string
      pattern: '^\d+(\.\d{1,8})?$'
      examples: ['0.25', '1.08']
    Percent:
      type: string
      pattern: '^\d{1,3}(\.\d{1,4})?$'
      examples: ['70', '30']
    NaicsCode:
      type: string
      pattern: '^\d{6}$'
      examples: ['531110']
    Construction:
      type: string
      enum: [Frame, JoistedMasonry, NonCombustible, MasonryNonCombustible, FireResistive]
    RatedFactor:
      type: object
      additionalProperties: false
      required: [step, code, value, premiumAfter]
      properties:
        step: { type: integer, minimum: 0 }
        code: { type: string, description: 'BASE_RATE, OCCUPANCY, PROTECTION_CLASS, BUILDING_AGE. New codes may be added.' }
        value: { $ref: '#/components/schemas/Rate' }
        premiumAfter: { $ref: '#/components/schemas/Money' }
    DecisionReason:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string, description: Reason code from the ruleset. New codes may be added. }
        message: { type: string }
        exposureRef: { type: string }
    RiskExposure:
      type: object
      additionalProperties: false
      description: One Exposure flattened with its Building and Location attributes; the input to Rules and Rating.
      required: [exposureRef, coverageCode, limit, naicsCode, construction, yearBuilt, protectionClass]
      properties:
        exposureRef: { type: string, maxLength: 64 }
        coverageCode: { type: string, const: BLDG }
        limit: { $ref: '#/components/schemas/Money' }
        naicsCode: { $ref: '#/components/schemas/NaicsCode' }
        construction: { $ref: '#/components/schemas/Construction' }
        yearBuilt: { type: integer, minimum: 1800, maximum: 2100 }
        protectionClass: { type: integer, minimum: 1, maximum: 10 }
